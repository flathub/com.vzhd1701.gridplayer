name: PyQt5
cleanup:
- "/bin"
- "/include"
- "/lib/python3.12/site-packages/*.pyi"
- "/lib/python3.12/site-packages/PyQt5/uic"
- "/lib/python3.12/site-packages/PyQt5/bindings"
config-opts:
- "--disable-static"
- "--enable-x11"
buildsystem: simple
build-commands:
- sip-install
  --target-dir ${FLATPAK_DEST}/lib/python3.12/site-packages
  --scripts-dir ${FLATPAK_DEST}/bin
  --build-dir ./build
  --jobs ${FLATPAK_BUILDER_N_JOBS}
  --confirm-license
  --no-docstrings
  --no-qml-plugin
  --no-designer-plugin
  --no-tools
  --enable=Qt
  --enable=QtCore
  --enable=QtDBus
  --enable=QtGui
  --enable=QtWidgets
  --enable=QtX11Extras
  --enable=QtSvg
sources:
- type: archive
  url: https://files.pythonhosted.org/packages/4d/5d/b8b6e26956ec113ad3f566e02abd12ac3a56b103fcc7e0735e27ee4a1df3/PyQt5-5.15.10.tar.gz
  sha256: d46b7804b1b10a4ff91753f8113e5b5580d2b4462f3226288e2d84497334898a
modules:
- name: python3-flit_core
  cleanup:
  - "*"
  buildsystem: simple
  build-commands:
  - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}"
    --prefix=${FLATPAK_DEST} "flit_core" --no-build-isolation
  sources:
  - type: file
    url: https://files.pythonhosted.org/packages/d5/ae/09427bea9227a33ec834ed5461432752fd5d02b14f93dd68406c91684622/flit_core-3.10.1.tar.gz
    sha256: 66e5b87874a0d6e39691f0e22f09306736b633548670ad3c09ec9db03c5662f7
- name: PyQt_builder
  cleanup:
  - "*"
  buildsystem: simple
  build-commands:
