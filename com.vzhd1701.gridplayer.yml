app-id: "com.vzhd1701.gridplayer"
runtime: org.kde.Platform
runtime-version: "6.11"
sdk: org.kde.Sdk
base: com.riverbankcomputing.PyQt.BaseApp
base-version: "6.11"
command: "gridplayer"
finish-args:
# OpenGL
- "--device=dri"
# GUI: Wayland, and X11 beside it, not only in its place: VLC Hardware and
# MPV's Direct draw into an X11 window, Xwayland's on a Wayland desktop. The
# app picks one of the two itself, by its Window system setting.
- "--share=ipc"
- "--socket=wayland"
- "--socket=x11"
# Sound
- "--socket=pulseaudio"
# Files & network
- "--share=network"
- "--filesystem=host"
- "--filesystem=xdg-run/gvfs"
# Screen inhibit
- "--talk-name=org.freedesktop.ScreenSaver"
# Tray icon, and its note that the player is still running
- "--talk-name=org.kde.StatusNotifierWatcher"
# Disable annoying warnings
# Qt: Session managment error: Could not open network socket
# https://stackoverflow.com/questions/986964/qt-session-management-error
- "--env=SESSION_MANAGER="

# Cleanup for com.riverbankcomputing.PyQt.BaseApp
cleanup-commands:
  - /app/cleanup-BaseApp.sh
build-options:
  env:
    - BASEAPP_REMOVE_WEBENGINE=1

cleanup:
- "/include"
- "/lib/*.a"
- "/lib/*.la"
- "/lib/pkgconfig"
- "/share/man"

modules:
- libvlc.yml
- libmpv.yml
- dependencies.yml
- uv_build.yml
- name: gridplayer
  buildsystem: simple
  build-commands:
  - pip3 install --no-index --no-deps --no-build-isolation --prefix=${FLATPAK_DEST} --root=/ .

  - install -Dm 644 meta/com.vzhd1701.gridplayer.desktop     ${FLATPAK_DEST}/share/applications/com.vzhd1701.gridplayer.desktop
  - install -Dm 644 meta/com.vzhd1701.gridplayer.appdata.xml ${FLATPAK_DEST}/share/metainfo/com.vzhd1701.gridplayer.appdata.xml
  - install -Dm 644 meta/com.vzhd1701.gridplayer.xml         ${FLATPAK_DEST}/share/mime/packages/com.vzhd1701.gridplayer.xml
  - (cd meta/icons && find * -type f -exec install -Dm 644 "{}" "${FLATPAK_DEST}/share/icons/{}" \;)
  sources:
  - type: git
    url: https://github.com/vzhd1701/gridplayer-flatpak.git
    commit: 55b133280dc44f682d9f776ce9eafe540caaa9a5
