app-id: "com.vzhd1701.gridplayer"
runtime: org.kde.Platform
runtime-version: "5.15-24.08"
sdk: org.kde.Sdk
command: "gridplayer"
finish-args:
# OpenGL
- "--device=dri"
# GUI
- "--share=ipc"
- "--socket=x11"
# Sound
- "--socket=pulseaudio"
# Files & network
- "--share=network"
- "--filesystem=host"
- "--filesystem=xdg-run/gvfs"
# Screen inhibit
- "--talk-name=org.freedesktop.ScreenSaver"
# Can't use Wayland
- "--env=QT_QPA_PLATFORM=xcb"
# Disable annoying warnings
# Qt: Session managment error: Could not open network socket
# https://stackoverflow.com/questions/986964/qt-session-management-error
- "--env=SESSION_MANAGER="

cleanup:
- "/include"
- "/lib/*.a"
- "/lib/*.la"
- "/lib/debug"
- "/lib/pkgconfig"
- "/share/man"

modules:
- libvlc.yml
- pyqt.yml
- dependencies.yml
- name: poetry-core
  cleanup:
  - "*"
  buildsystem: simple
  build-commands:
    - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}"
      --prefix=${FLATPAK_DEST} "poetry-core==2.2.1" --no-build-isolation
  sources:
    - type: file
      url: https://files.pythonhosted.org/packages/c7/d8/bb2f602f5e012e177e1c8560125f9770945d36622595990cf1cb794477c2/poetry_core-2.2.1-py3-none-any.whl
      sha256: bdfce710edc10bfcf9ab35041605c480829be4ab23f5bc01202cfe5db8f125ab
- name: gridplayer
  buildsystem: simple
  build-commands:
  - pip3 install --no-index --no-deps --no-build-isolation --prefix=${FLATPAK_DEST} --root=/ .

  - install -Dm 644 meta/com.vzhd1701.gridplayer.desktop     ${FLATPAK_DEST}/share/applications/com.vzhd1701.gridplayer.desktop
  - install -Dm 644 meta/com.vzhd1701.gridplayer.appdata.xml ${FLATPAK_DEST}/share/metainfo/com.vzhd1701.gridplayer.appdata.xml
  - install -Dm 644 meta/com.vzhd1701.gridplayer.xml         ${FLATPAK_DEST}/share/mime/packages/com.vzhd1701.gridplayer.xml
  - (cd meta/icons && find * -type f -exec install -Dm 644 "{}" "${FLATPAK_DEST}/share/icons/{}" \;)
  sources:
  - type: git
    url: https://github.com/vzhd1701/gridplayer-flatpak.git
    commit: 5e38b0de1e8601ac040baef98b7bbe232ea69f02
